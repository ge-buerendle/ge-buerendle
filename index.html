    --surface: #1a1a22;
    --border: #2e2e3a;
    --correct: #4ade80;
    --present: #facc15;
    --absent: #3a3a4a;
    --text: #f0f0f5;
    --muted: #666680;
    --accent: #818cf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(48px, env(safe-area-inset-top, 48px)) 12px 80px;
    background-image: radial-gradient(ellipse at 20% 10%, #1e1b4b22 0%, transparent 60%),

  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    letter-spacing: 0.15em;
    color: var(--text);
    line-height: 1;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Kleiner Moduswechsel-Button oben rechts */
  #mode-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 12px;
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent;
    margin-bottom: 14px;
  }

  #mode-pill:active { transform: scale(0.96); }
  #mode-pill .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
  }

  /* Start-Overlay (Modusauswahl) */
  #start-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(4px);
    z-index: 110;
    align-items: center;
    justify-content: center;
  }
  #start-overlay.show { display: flex; }

  #start-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    max-width: 320px;
    width: 88vw;
    animation: popIn 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  #start-panel h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.6rem;
    letter-spacing: 0.1em;
    color: var(--text);
  }

  #start-panel p.hint {
    font-size: 0.72rem;
    color: var(--muted);
    line-height: 1.5;
    margin-top: -8px;
  }

  .start-btn {
    width: 100%;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 14px 18px;
    border-radius: 10px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: opacity 0.15s, transform 0.1s;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .start-btn:active { transform: scale(0.97); }

  .start-btn .label {
    font-size: 0.85rem;
  }

  .start-btn .sub {
    font-size: 0.6rem;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0.02em;
    opacity: 0.75;
  }

  #start-daily {
    background: var(--accent);
    color: #0f0f12;
    border-color: var(--accent);
  }

  #start-endless {
    background: transparent;
    color: var(--text);
  }

    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 28px;
  }

  .row {
    display: flex;
    gap: 8px;

  .tile {
    width: clamp(48px, 13vw, 64px);
    height: clamp(48px, 13vw, 64px);
    border: 2px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(1.4rem, 5vw, 2rem);
    letter-spacing: 0.05em;
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s, background 0.3s, transform 0.08s;
    position: relative;
    overflow: hidden;
  }

  .tile.filled {
    border-color: var(--accent);
    transform: scale(1.06);
  }

  .tile.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: #0f0f12;
    animation: flip 0.4s ease forwards;
  }

  .tile.present {
    background: var(--present);
    border-color: var(--present);
    color: #0f0f12;
    animation: flip 0.4s ease forwards;
  }

  .tile.absent {
    background: var(--absent);
    border-color: var(--absent);
    color: var(--muted);
    animation: flip 0.4s ease forwards;
  }

  .tile.shake {
    animation: shake 0.4s ease;
  }

  @keyframes flip {
    0%   { transform: scaleY(1); }
    50%  { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }

    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);

    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 102;
  }

const MAX_GUESSES = 6;
const WORD_LEN = 4;
const STORAGE_KEY = 'gebuerendle_progress';
const STORAGE_VERSION = 2; // Erhöht, weil sich die Berechnung der Tages-Paraphe geändert hat

let target, teacherData, currentRow, currentCol, board, gameOver, keyStates, guessHistory, mode, lastResultWon;

// ---- Speicher für den Fortschritt (welche Paraphen schon "dran" waren) ----
function defaultProgress() {
  return { usedDaily: [], lastDailyDate: null, lastDailyWon: null, lastDailyTeacher: null, mode: 'daily', version: STORAGE_VERSION };
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return defaultProgress();
    const parsed = JSON.parse(raw);
    // Alte, mit einem früheren Algorithmus berechnete Tagesauswahlen verwerfen
    if (parsed.version !== STORAGE_VERSION) {
      const fresh = defaultProgress();
      fresh.mode = parsed.mode || 'daily'; // gewählten Modus behalten
      return fresh;
    }
    return parsed;
  } catch (e) {
    return defaultProgress();
  }
}

function saveProgress(progress) {
  try {
    progress.version = STORAGE_VERSION;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
  } catch (e) { /* ignore */ }
}

// ---- Heutiges Datum nach deutscher Zeit (Europe/Berlin) als YYYY-MM-DD ----
function getBerlinDateString() {
  const now = new Date();
  const parts = new Intl.DateTimeFormat('de-DE', {
    timeZone: 'Europe/Berlin',
    year: 'numeric', month: '2-digit', day: '2-digit'
  }).formatToParts(now);
  const y = parts.find(p => p.type === 'year').value;
  const m = parts.find(p => p.type === 'month').value;
  const d = parts.find(p => p.type === 'day').value;
  return `${y}-${m}-${d}`;
}

// Wählt die Paraphe des Tages. Die Auswahl ist rein vom Datum abhängig (nicht vom
// persönlichen Spielfortschritt), damit alle am selben Tag dieselbe Paraphe bekommen.
// Erst wenn ein voller Zyklus durch alle Lehrer:innen abgeschlossen ist, wiederholt sich jemand.
const CYCLE_START_DATE = new Date('2026-06-17T00:00:00+02:00'); // Referenzpunkt für Tag 0 des Zyklus

function daysSinceCycleStart(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  const current = new Date(Date.UTC(y, m - 1, d));
  const start = new Date(Date.UTC(
    CYCLE_START_DATE.getUTCFullYear(), CYCLE_START_DATE.getUTCMonth(), CYCLE_START_DATE.getUTCDate()
  ));
  const diffMs = current - start;
  return Math.floor(diffMs / 86400000);
}

// Eine feste, gemischte Reihenfolge aller Paraphen, damit der Zyklus nicht einfach
// alphabetisch durchläuft. Basiert auf einem Seed-Hash, ist aber für alle gleich.
function getShuffledOrder() {
  const indices = LEHRER.map((_, i) => i);
  // Deterministisches Mischen (Fisher-Yates mit festem Seed)
  let seed = 1337;
  function seededRandom() {
    seed = (seed * 9301 + 49297) % 233280;
    return seed / 233280;
  }
  for (let i = indices.length - 1; i > 0; i--) {
    const j = Math.floor(seededRandom() * (i + 1));
    [indices[i], indices[j]] = [indices[j], indices[i]];
  }
  return indices;
}

const SHUFFLED_ORDER = getShuffledOrder();

function pickDailyTeacher(progress) {
  const dateStr = getBerlinDateString();

  // Falls heute schon eine Auswahl getroffen wurde, diese wiederverwenden
  if (progress.lastDailyDate === dateStr && progress.lastDailyTeacher) {
    const found = LEHRER.find(l => l.paraphe === progress.lastDailyTeacher);
    if (found) return { teacher: found, dateStr, isNewDay: false };
  }

  // Tagesindex im festen, für alle identischen Zyklus
  const dayOffset = daysSinceCycleStart(dateStr);
  const cycleLength = LEHRER.length;
  const positionInCycle = ((dayOffset % cycleLength) + cycleLength) % cycleLength; // immer positiv
  const teacherIndex = SHUFFLED_ORDER[positionInCycle];
  const chosen = LEHRER[teacherIndex];

  progress.lastDailyDate = dateStr;
  progress.lastDailyTeacher = chosen.paraphe;
  progress.lastDailyWon = null;
  progress.lastDailyGuesses = [];
  progress.lastDailyRow = null;
  saveProgress(progress);

  return { teacher: chosen, dateStr, isNewDay: true };
}

function pickRandom() {
  return LEHRER[Math.floor(Math.random() * LEHRER.length)];
}

function setMode(newMode) {
  mode = newMode;
  const progress = loadProgress();
  progress.mode = newMode;
  saveProgress(progress);

  updateModePill();
  init();
}

function updateModePill() {
  document.getElementById('mode-pill-label').textContent = mode === 'daily' ? '📅 Täglich' : '♾️ Unendlich';
}

function init() {
  const progress = loadProgress();

  if (mode === 'daily') {
    const dateStr = getBerlinDateString();
    const { teacher } = pickDailyTeacher(progress);
    teacherData = teacher;
    target = teacherData.paraphe.toUpperCase();

    // Bereits heute gespielt und beendet?
    const freshProgress = loadProgress();
    if (freshProgress.lastDailyDate === dateStr && freshProgress.lastDailyWon !== null) {
      gameOver = true;
      currentRow = freshProgress.lastDailyRow || 0;
      currentCol = 0;
      keyStates = {};
      guessHistory = freshProgress.lastDailyGuesses || [];
      buildBoard();
      buildKeyboard();
      replayGuesses();
      setTimeout(() => showResult(freshProgress.lastDailyWon, true), 300);
      return;
    }
  } else {
    teacherData = pickRandom();
    target = teacherData.paraphe.toUpperCase();
  }

  currentRow = 0;
  currentCol = 0;
  gameOver = false;
  keyStates = {};
  guessHistory = [];

  document.getElementById('overlay').classList.remove('show');
  document.getElementById('message').textContent = '';

  buildBoard();
  buildKeyboard();

  // Falls im Tagesmodus bereits unfertige Versuche gespeichert sind, diese wiederherstellen
  if (mode === 'daily') {
    const freshProgress2 = loadProgress();
    const savedGuesses = freshProgress2.lastDailyDate === getBerlinDateString() ? (freshProgress2.lastDailyGuesses || []) : [];
    if (savedGuesses.length > 0) {
      guessHistory = savedGuesses.slice();
      currentRow = guessHistory.length;
      replayGuesses();
    }
  }
}

// Versuche aus dem Speicher erneut auf dem Brett anzeigen (für bereits gelöstes Tagesrätsel)
function replayGuesses() {
  guessHistory.forEach((guess, r) => {
    const result = evaluate(guess, target);
    guess.split('').forEach((ch, c) => {
      board[r][c].textContent = ch;
      board[r][c].classList.add(result[c]);
    });
    result.forEach((state, i) => {
      const ch = guess[i];
      const cur = keyStates[ch];
      if (cur !== 'correct') {
        if (state === 'correct' || cur !== 'present') keyStates[ch] = state;
      }
    });
  });
  updateKeyboard();
}

function buildBoard() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  board = [];
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    const tiles = [];
    for (let c = 0; c < WORD_LEN; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      row.appendChild(t);
      tiles.push(t);
    }
    b.appendChild(row);
    board.push(tiles);
  }
}

const KB_ROWS = [
  ['Q','W','E','R','T','Z','U','I','O','P','Ü'],
  ['A','S','D','F','G','H','J','K','L','Ö'],
  ['ENTER','Y','X','C','V','B','N','M','Ä','⌫']
];

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      div.appendChild(btn);
    });
    kb.appendChild(div);
  });
}

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫' || k === 'BACKSPACE') {
    deleteLetter();
  } else if (k === 'ENTER') {
    submitGuess();
  } else if (/^[A-ZÄÖÜa-zäöü]$/.test(k)) {
    addLetter(k.toUpperCase());
  }
}

function addLetter(l) {
  if (currentCol >= WORD_LEN) return;
  board[currentRow][currentCol].textContent = l;
  board[currentRow][currentCol].classList.add('filled');
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  board[currentRow][currentCol].textContent = '';
  board[currentRow][currentCol].classList.remove('filled');
}

function submitGuess() {
  if (currentCol < WORD_LEN) {
    showMessage('Noch ' + (WORD_LEN - currentCol) + ' Buchstabe(n) fehlen!');
    shakeRow(currentRow);
    return;
  }

  const guess = board[currentRow].map(t => t.textContent).join('');

  const validParaphen = LEHRER.map(l => l.paraphe.toUpperCase());
  if (!validParaphen.includes(guess)) {
    showMessage('Keine gültige Paraphe!');
    shakeRow(currentRow);
    return;
  }

  const result = evaluate(guess, target);
  guessHistory.push(guess);

  if (mode === 'daily') saveDailyProgress();

  // animate tiles with delay
  result.forEach((state, i) => {
    setTimeout(() => {
      const tile = board[currentRow][i];
      tile.classList.remove('filled');
      tile.classList.add(state);
    }, i * 120);
  });

  // update keyboard after animation
  setTimeout(() => {
    result.forEach((state, i) => {
      const ch = guess[i];
      const cur = keyStates[ch];
      if (cur !== 'correct') {
        if (state === 'correct' || cur !== 'present') {
          keyStates[ch] = state;
        }
      }
    });
    updateKeyboard();

    if (guess === target) {
      gameOver = true;
      if (mode === 'daily') saveDailyResult(true);
      setTimeout(() => showResult(true), 400);
    } else {
      currentRow++;
      currentCol = 0;
      if (currentRow >= MAX_GUESSES) {
        gameOver = true;
        if (mode === 'daily') saveDailyResult(false);
        setTimeout(() => showResult(false), 400);
      }
    }
  }, WORD_LEN * 120 + 200);
}

function saveDailyProgress() {
  const progress = loadProgress();
  progress.lastDailyGuesses = guessHistory.slice();
  saveProgress(progress);
}

function saveDailyResult(won) {
  const progress = loadProgress();
  progress.lastDailyWon = won;
  progress.lastDailyRow = won ? currentRow + 1 : MAX_GUESSES;
  progress.lastDailyGuesses = guessHistory.slice();
  saveProgress(progress);
}

function evaluate(guess, target) {
  const result = Array(WORD_LEN).fill('absent');
  const tArr = target.split('');
  const gArr = guess.split('');
  const used = Array(WORD_LEN).fill(false);

  // correct pass
  gArr.forEach((ch, i) => {
    if (ch === tArr[i]) {
      result[i] = 'correct';
      used[i] = true;
    }
  });

  // present pass
  gArr.forEach((ch, i) => {
    if (result[i] === 'correct') return;
    const j = tArr.findIndex((tc, ti) => tc === ch && !used[ti] && result[i] !== 'correct');
    if (j !== -1) {
      result[i] = 'present';
      used[j] = true;
    }
  });

  return result;
}

function updateKeyboard() {
  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.dataset.key;
    if (keyStates[k]) {
      btn.className = 'key' + (btn.classList.contains('wide') ? ' wide' : '') + ' ' + keyStates[k];
    }
  });
}

function showMessage(msg, duration = 1800) {
  const el = document.getElementById('message');
  el.textContent = msg;
  if (duration > 0) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, duration);
}

function shakeRow(r) {
  board[r].forEach(t => {
    t.classList.add('shake');
    t.addEventListener('animationend', () => t.classList.remove('shake'), { once: true });
  });
}

function showResult(won, isReplay = false) {
  lastResultWon = won;
  const overlay = document.getElementById('overlay');
  const label = document.getElementById('result-label');
  const info  = document.getElementById('result-teacher');
  const pips  = document.getElementById('pips');
  const playAgainBtn = document.getElementById('play-again');

  label.textContent = won ? '🎉 Richtig!' : '😬 Verloren';
  label.style.color = won ? 'var(--correct)' : '#f87171';

  info.innerHTML = `<strong>${teacherData.paraphe}</strong>${teacherData.name}`;

  pips.innerHTML = '';
  const usedRows = won ? guessHistory.length : MAX_GUESSES;
  for (let i = 0; i < MAX_GUESSES; i++) {
    const pip = document.createElement('div');
    pip.className = 'pip' + (i < usedRows ? ' done' : '');
    pips.appendChild(pip);
  }

  if (mode === 'daily') {
    playAgainBtn.textContent = 'Zurück zum Spiel';
    playAgainBtn.dataset.dailyDismiss = 'true';
  } else {
    playAgainBtn.textContent = 'Nochmal spielen';
    playAgainBtn.dataset.dailyDismiss = 'false';
  }

  const switchBtn = document.getElementById('switch-to-endless');
  switchBtn.style.display = (mode === 'daily' && won) ? 'block' : 'none';

  overlay.classList.add('show');
  if (won && !isReplay) startConfetti();
}

function buildShareText(won) {
  const dateStr = getBerlinDateString();
  const modeLabel = mode === 'daily' ? 'Tagesrätsel' : 'Unendlicher Modus';
  const attempts = won ? guessHistory.length : 'X';
  const emojiMap = { correct: '🟩', present: '🟨', absent: '⬛' };

  let lines = [`GE-Bürendle – ${modeLabel}${mode === 'daily' ? ' (' + dateStr + ')' : ''}`];
  lines.push(`${attempts}/${MAX_GUESSES} Versuche`);
  lines.push('');

  guessHistory.forEach(guess => {
    const result = evaluate(guess, target);
    lines.push(result.map(state => emojiMap[state]).join(''));
  });

  lines.push('');
  lines.push('https://ge-buerendle.github.io/ge-buerendle/');

  return lines.join('\n');
}

async function shareResult() {
  const text = buildShareText(lastResultWon);
  const btn = document.getElementById('share-result');
  const originalLabel = btn.textContent;

  try {
    if (navigator.share) {
      await navigator.share({ text });
      return;
    }
  } catch (e) {
    // Nutzer hat Share-Dialog abgebrochen oder nicht unterstützt -> Fallback unten
  }

  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = '✅ Kopiert!';
  } catch (e) {
    btn.textContent = '⚠️ Kopieren fehlgeschlagen';
  }
  setTimeout(() => { btn.textContent = originalLabel; }, 1800);
}

function startConfetti() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#4ade80','#facc15','#818cf8','#f87171','#38bdf8','#fb923c'];
  const pieces = Array.from({length: 120}, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: Math.random() * 10 + 5,
    h: Math.random() * 6 + 3,
    color: colors[Math.floor(Math.random() * colors.length)],
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.15,
    vx: (Math.random() - 0.5) * 3,
    vy: Math.random() * 4 + 2,
  }));

  let frame;
  let elapsed = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotSpeed;
      if (p.y > canvas.height) { p.y = -20; p.x = Math.random() * canvas.width; }
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    elapsed++;
    if (elapsed < 180) frame = requestAnimationFrame(draw);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  draw();
}

document.getElementById('play-again').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  const canvas = document.getElementById('confetti-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  if (mode === 'daily') {
    // Tagesrätsel ist bereits gelöst/verloren -> nur Overlay schließen, kein neues Spiel
    return;
  }
  init();
});

document.getElementById('start-daily').addEventListener('click', () => {
  document.getElementById('start-overlay').classList.remove('show');
  setMode('daily');
});

document.getElementById('start-endless').addEventListener('click', () => {
  document.getElementById('start-overlay').classList.remove('show');
  setMode('endless');
});

document.getElementById('mode-pill').addEventListener('click', () => {
  document.getElementById('start-overlay').classList.add('show');
});

document.getElementById('switch-to-endless').addEventListener('click', () => {
  document.getElementById('overlay').classList.remove('show');
  const canvas = document.getElementById('confetti-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  setMode('endless');
});

document.getElementById('share-result').addEventListener('click', shareResult);

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if (k === 'BACKSPACE') handleKey('⌫');
  else if (k === 'ENTER') handleKey('ENTER');
  else if (/^[A-ZÄÖÜ]$/.test(k)) handleKey(k);
});

// Beim ersten Besuch: Modusauswahl zeigen. Danach: zuletzt gewählten Modus übernehmen.
const startProgress = loadProgress();
if (startProgress.mode) {
  mode = startProgress.mode;
  updateModePill();
  init();
} else {
  mode = 'daily';
  updateModePill();
  document.getElementById('start-overlay').classList.add('show');
}
</script>
