<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GE-Bürendle</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f12;
    --surface: #1a1a22;
    --border: #2e2e3a;
    --correct: #4ade80;
    --present: #facc15;
    --absent: #3a3a4a;
    --text: #f0f0f5;
    --muted: #666680;
    --accent: #818cf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    background-image: radial-gradient(ellipse at 20% 10%, #1e1b4b22 0%, transparent 60%),
                      radial-gradient(ellipse at 80% 80%, #16213022 0%, transparent 60%);
  }

  header {
    text-align: center;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 8vw, 3.6rem);
    letter-spacing: 0.15em;
    color: var(--text);
    line-height: 1;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* Board */
  #board {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 28px;
  }

  .row {
    display: flex;
    gap: 8px;
  }

  .tile {
    width: 64px;
    height: 64px;
    border: 2px solid var(--border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2rem;
    letter-spacing: 0.05em;
    background: var(--surface);
    color: var(--text);
    transition: border-color 0.15s, background 0.3s, transform 0.08s;
    position: relative;
    overflow: hidden;
  }

  .tile.filled {
    border-color: var(--accent);
    transform: scale(1.06);
  }

  .tile.correct {
    background: var(--correct);
    border-color: var(--correct);
    color: #0f0f12;
    animation: flip 0.4s ease forwards;
  }

  .tile.present {
    background: var(--present);
    border-color: var(--present);
    color: #0f0f12;
    animation: flip 0.4s ease forwards;
  }

  .tile.absent {
    background: var(--absent);
    border-color: var(--absent);
    color: var(--muted);
    animation: flip 0.4s ease forwards;
  }

  .tile.shake {
    animation: shake 0.4s ease;
  }

  @keyframes flip {
    0%   { transform: scaleY(1); }
    50%  { transform: scaleY(0); }
    100% { transform: scaleY(1); }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%       { transform: translateX(-6px); }
    40%       { transform: translateX(6px); }
    60%       { transform: translateX(-4px); }
    80%       { transform: translateX(4px); }
  }

  /* Keyboard */
  #keyboard {
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: center;
    margin-bottom: 24px;
  }

  .kb-row {
    display: flex;
    gap: 6px;
  }

  .key {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 0;
    width: 36px;
    height: 44px;
    border-radius: 5px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background 0.2s, border-color 0.2s, transform 0.08s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .key:active { transform: scale(0.92); }

  .key.wide {
    width: 54px;
    font-size: 0.62rem;
    letter-spacing: -0.03em;
  }

  .key.correct { background: var(--correct); border-color: var(--correct); color: #0f0f12; }
  .key.present { background: var(--present); border-color: var(--present); color: #0f0f12; }
  .key.absent  { background: var(--absent);  border-color: var(--absent);  color: var(--muted); }

  /* Message */
  #message {
    height: 28px;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: center;
    margin-bottom: 8px;
    min-height: 28px;
  }

  /* Result panel */
  #result-panel {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 28px;
    text-align: center;
    max-width: 320px;
    width: 100%;
  }

  #result-panel.show { display: flex; }

  #result-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.8rem;
    letter-spacing: 0.12em;
  }

  #result-teacher {
    font-size: 0.82rem;
    color: var(--muted);
    line-height: 1.6;
  }

  #result-teacher strong {
    color: var(--text);
    display: block;
    font-size: 1.1rem;
    margin-bottom: 2px;
  }

  #play-again {
    background: var(--accent);
    color: #0f0f12;
    border: none;
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 10px 24px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 4px;
    transition: opacity 0.15s, transform 0.1s;
  }

  #play-again:hover { opacity: 0.85; transform: scale(1.03); }

  .pip-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
  }

  .pip {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--border);
  }
  .pip.done { background: var(--correct); }
</style>
</head>
<body>

<header>
  <h1><span style="color:#C0392B">G</span><span style="color:#2471A3">E</span><span style="color:#F0F0F5">-</span><span style="color:#1A7A4A">B</span><span style="color:#E8B84B">ü</span><span style="color:#C0392B">r</span><span style="color:#2471A3">e</span><span style="color:#1A7A4A">n</span><span style="color:#E8B84B">d</span><span style="color:#C0392B">l</span><span style="color:#2471A3">e</span></h1>
  <p class="subtitle">Errate die Paraphe · 4 Buchstaben · 6 Versuche</p>
</header>

<div id="message"></div>
<div id="board"></div>
<div id="keyboard"></div>

<div id="result-panel">
  <div id="result-label"></div>
  <div id="result-teacher"></div>
  <div class="pip-row" id="pips"></div>
  <button id="play-again">Nochmal spielen</button>
</div>

<script>
// ============================================================
// LEHRERLI STE — hier anpassen!
// Format: { paraphe: "XxXx", name: "Vorname Nachname", fach: "Fach (optional)" }
// ============================================================
const LEHRER = [
  { paraphe: "AhlS", name: "Frau Ahlemeyer" },
  { paraphe: "BenN", name: "Frau Benke" },
  { paraphe: "BerI", name: "Frau Berg" },
  { paraphe: "BloP", name: "Frau Blömker" },
  { paraphe: "BisA", name: "Frau Bisterfeld" },
  { paraphe: "BonR", name: "Herr Bonke" },
  { paraphe: "BücJ",  name: "Frau Büchel" },
  { paraphe: "CarU", name: "Frau Carl" },
  { paraphe: "DisV", name: "Frau Discher" },
  { paraphe: "DreJ", name: "Frau Drees" },
  { paraphe: "DurA", name: "Frau Duraj" },
  { paraphe: "EppP", name: "Herr Epp" },
  { paraphe: "EvmC", name: "Frau Eversmann" },
  { paraphe: "FarF", name: "Herr Farke" },
  { paraphe: "FecS", name: "Frau Fecke" },
  { paraphe: "FisS", name: "Herr Fischer" },
  { paraphe: "FreJ", name: "Frau Frenz" },
  { paraphe: "FucC", name: "Frau Fuchs" },
  { paraphe: "GaeN", name: "Frau Gaertner" },
  { paraphe: "GelI", name: "Herr Gelwer" },
  { paraphe: "GraD", name: "Herr Graß" },
  { paraphe: "HacT", name: "Herr Hachmeister" },
  { paraphe: "HamC", name: "Herr Hamm" },
  { paraphe: "HoeJ", name: "Herr Hönig" },
  { paraphe: "JahM", name: "Frau Jahn" },
  { paraphe: "JakS", name: "Herr Jakobi" },
  { paraphe: "KapM", name: "Frau Kappius" },
  { paraphe: "KatM", name: "Herr Katz" },
  { paraphe: "KlaB", name: "Herr Klafki" },
  { paraphe: "KleD", name: "Frau Kleine" },
  { paraphe: "KloT", name: "Herr Kloppenburg" },
  { paraphe: "KoeT", name: "Herr Köchling" },
  { paraphe: "KonA", name: "Herr Konen" },
  { paraphe: "ManL", name: "Frau Manns" },
  { paraphe: "MatK", name: "Frau Matussek" },
  { paraphe: "MesC", name: "Herr Meschede" },
  { paraphe: "MerS", name: "Herr Merz" },
  { paraphe: "MeuV", name: "Frau Meul" },
  { paraphe: "MeyA", name: "Frau Meyer" },
  { paraphe: "NsaS", name: "Frau Nsanzabandi" },
  { paraphe: "PacS", name: "Herr Pachur" },
  { paraphe: "PelE", name: "Frau Pelka" },
  { paraphe: "PetP", name: "Herr Peters" },
  { paraphe: "PfiI", name: "Frau Pfitzner" },
  { paraphe: "RehC", name: "Frau Rehmann" },
  { paraphe: "RicF", name: "Herr Richter" },
  { paraphe: "RieB", name: "Frau Riepe" },
  { paraphe: "RinH", name: "Frau Rinklake" },
  { paraphe: "RobS", name: "Herr Robinson" },
  { paraphe: "RocL", name: "Frau Rochell" },
  { paraphe: "RmaL", name: "Frau Rullmann" },
  { paraphe: "RueV", name: "Frau von Rüden" },
  { paraphe: "SchM", name: "Frau Schmelter" },
  { paraphe: "SchO", name: "Herr Schmies" },
  { paraphe: "SchL", name: "Frau Schneider" },
  { paraphe: "ScuS", name: "Herr Schulte" },
  { paraphe: "SchF", name: "Herr Schwarz" },
  { paraphe: "SieA", name: "Frau Siedhoff" },
  { paraphe: "SihJ", name: "Frau Sihr" },
  { paraphe: "SomK", name: "Frau Sommer" },
  { paraphe: "SteL", name: "Frau Steindl" },
  { paraphe: "StoK", name: "Frau Stockbrink" },
  { paraphe: "StoO", name: "Herr Stoll" },
  { paraphe: "StrM", name: "Herr Strauß" },
  { paraphe: "SykS", name: "Herr Sykes" },
  { paraphe: "TilC", name: "Frau Tillmanns" },
  { paraphe: "TriN", name: "Herr Trilling" },
  { paraphe: "TscM", name: "Frau Tschudow" },
  { paraphe: "VieJ", name: "Herr Vieth" },
  { paraphe: "VolM", name: "Herr Vollmer" },
  { paraphe: "WedG", name: "Frau Wedekind" },
  { paraphe: "WegM", name: "Frau Wegemann" },
  { paraphe: "WegL", name: "Frau Wegener" },
  { paraphe: "WeiM", name: "Frau Weihrich" },
  { paraphe: "WerS", name: "Frau Werny" },
  { paraphe: "WinM", name: "Frau Winkel" },
  { paraphe: "WinP", name: "Herr Winkel" },
  { paraphe: "WolT", name: "Herr Wolf" },
];
// ============================================================

const MAX_GUESSES = 6;
const WORD_LEN = 4;

let target, teacherData, currentRow, currentCol, board, gameOver, keyStates, guessHistory;

function pickRandom() {
  return LEHRER[Math.floor(Math.random() * LEHRER.length)];
}

function init() {
  teacherData = pickRandom();
  target = teacherData.paraphe.toUpperCase();
  currentRow = 0;
  currentCol = 0;
  gameOver = false;
  keyStates = {};
  guessHistory = [];

  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('message').textContent = '';

  buildBoard();
  buildKeyboard();
}

function buildBoard() {
  const b = document.getElementById('board');
  b.innerHTML = '';
  board = [];
  for (let r = 0; r < MAX_GUESSES; r++) {
    const row = document.createElement('div');
    row.className = 'row';
    const tiles = [];
    for (let c = 0; c < WORD_LEN; c++) {
      const t = document.createElement('div');
      t.className = 'tile';
      row.appendChild(t);
      tiles.push(t);
    }
    b.appendChild(row);
    board.push(tiles);
  }
}

const KB_ROWS = [
  ['Q','W','E','R','T','Z','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Y','X','C','V','B','N','M','⌫'],
  ['Ä','Ö','Ü']
];

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KB_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kb-row';
    row.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k.length > 1 ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      div.appendChild(btn);
    });
    kb.appendChild(div);
  });
}

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫' || k === 'BACKSPACE') {
    deleteLetter();
  } else if (k === 'ENTER') {
    submitGuess();
  } else if (/^[A-ZÄÖÜa-zäöü]$/.test(k)) {
    addLetter(k.toUpperCase());
  }
}

function addLetter(l) {
  if (currentCol >= WORD_LEN) return;
  board[currentRow][currentCol].textContent = l;
  board[currentRow][currentCol].classList.add('filled');
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  board[currentRow][currentCol].textContent = '';
  board[currentRow][currentCol].classList.remove('filled');
}

function submitGuess() {
  if (currentCol < WORD_LEN) {
    showMessage('Noch ' + (WORD_LEN - currentCol) + ' Buchstabe(n) fehlen!');
    shakeRow(currentRow);
    return;
  }

  const guess = board[currentRow].map(t => t.textContent).join('');
  const result = evaluate(guess, target);
  guessHistory.push(guess);

  // animate tiles with delay
  result.forEach((state, i) => {
    setTimeout(() => {
      const tile = board[currentRow][i];
      tile.classList.remove('filled');
      tile.classList.add(state);
    }, i * 120);
  });

  // update keyboard after animation
  setTimeout(() => {
    result.forEach((state, i) => {
      const ch = guess[i];
      const cur = keyStates[ch];
      if (cur !== 'correct') {
        if (state === 'correct' || cur !== 'present') {
          keyStates[ch] = state;
        }
      }
    });
    updateKeyboard();

    if (guess === target) {
      gameOver = true;
      setTimeout(() => showResult(true), 400);
    } else {
      currentRow++;
      currentCol = 0;
      if (currentRow >= MAX_GUESSES) {
        gameOver = true;
        setTimeout(() => showResult(false), 400);
      }
    }
  }, WORD_LEN * 120 + 200);
}

function evaluate(guess, target) {
  const result = Array(WORD_LEN).fill('absent');
  const tArr = target.split('');
  const gArr = guess.split('');
  const used = Array(WORD_LEN).fill(false);

  // correct pass
  gArr.forEach((ch, i) => {
    if (ch === tArr[i]) {
      result[i] = 'correct';
      used[i] = true;
    }
  });

  // present pass
  gArr.forEach((ch, i) => {
    if (result[i] === 'correct') return;
    const j = tArr.findIndex((tc, ti) => tc === ch && !used[ti] && result[i] !== 'correct');
    if (j !== -1) {
      result[i] = 'present';
      used[j] = true;
    }
  });

  return result;
}

function updateKeyboard() {
  document.querySelectorAll('.key').forEach(btn => {
    const k = btn.dataset.key;
    if (keyStates[k]) {
      btn.className = 'key' + (btn.classList.contains('wide') ? ' wide' : '') + ' ' + keyStates[k];
    }
  });
}

function showMessage(msg, duration = 1800) {
  const el = document.getElementById('message');
  el.textContent = msg;
  if (duration > 0) setTimeout(() => { if (el.textContent === msg) el.textContent = ''; }, duration);
}

function shakeRow(r) {
  board[r].forEach(t => {
    t.classList.add('shake');
    t.addEventListener('animationend', () => t.classList.remove('shake'), { once: true });
  });
}

function showResult(won) {
  const panel = document.getElementById('result-panel');
  const label = document.getElementById('result-label');
  const info  = document.getElementById('result-teacher');
  const pips  = document.getElementById('pips');

  label.textContent = won ? '🎉 Richtig!' : '❌ Verloren';
  label.style.color = won ? 'var(--correct)' : '#f87171';

  let html = `<strong>${teacherData.paraphe}</strong>${teacherData.name}`;
  info.innerHTML = html;

  pips.innerHTML = '';
  for (let i = 0; i < MAX_GUESSES; i++) {
    const pip = document.createElement('div');
    pip.className = 'pip' + (i < currentRow || (won && i === currentRow - 1 + (won ? 1 : 0)) ? ' done' : '');
    // simple: mark used rows
    if (i < (won ? currentRow : MAX_GUESSES)) pip.classList.add('done');
    pips.appendChild(pip);
  }

  panel.classList.add('show');
}

document.getElementById('play-again').addEventListener('click', init);

document.addEventListener('keydown', e => {
  const k = e.key.toUpperCase();
  if (k === 'BACKSPACE') handleKey('⌫');
  else if (k === 'ENTER') handleKey('ENTER');
  else if (/^[A-ZÄÖÜ]$/.test(k)) handleKey(k);
});

init();
</script>
</body>
</html>
